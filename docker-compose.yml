services:
  postgres:
    image: postgres:15
    container_name: payment_processor_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_processor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-payment_processor}" ]
      interval: 10s
      timeout: 5s
      retries: 5
